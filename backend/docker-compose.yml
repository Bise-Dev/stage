services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stage}
      POSTGRES_USER: ${POSTGRES_USER:-stage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stage}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stage}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
