repos:
  - repo: local
    hooks:
      - id: backend-lint
        name: backend lint (ruff)
        entry: bash -c 'cd backend && just lint'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: backend-typecheck
        name: backend typecheck (pyrefly)
        entry: bash -c 'cd backend && just typecheck'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: client-lint
        name: client lint (biome + cargo fmt)
        entry: bash -c 'cd client && just lint'
        language: system
        pass_filenames: false
        files: ^client/.*\.(ts|tsx|js|jsx|json|rs|toml)$

      - id: client-check
        name: client check (tsc + cargo check)
        entry: bash -c 'cd client && just check'
        language: system
        pass_filenames: false
        files: ^client/.*\.(ts|tsx|rs)$
