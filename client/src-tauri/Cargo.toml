[package]
name = "stage-client"
version = "0.0.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
# Unbundled (i.e. `tauri dev`), macOS labels the Dock tile and the app menu with
# the running binary's name, so the binary is named after the product rather than
# the crate — otherwise the dev app shows up as "stage-client". `tauri build`
# picks up the same name for `Stage.app/Contents/MacOS/`. `default-run` is what
# marks it as the main binary for the Tauri CLI (it no longer matches the package
# name).
default-run = "Stage"

[[bin]]
name = "Stage"
path = "src/main.rs"

[lib]
name = "stage_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
stage-core = { path = "../stage-core" }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Generates the TypeScript IPC types from these Rust structs — see the note in
# `stage-core/Cargo.toml`. Same 10.x pin to stay within `rust-version = "1.77"`.
ts-rs = "10"
git2 = { version = "0.19", default-features = false }
notify = "6"
notify-debouncer-mini = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "net", "io-util", "sync"] }
base64ct = { version = "1", features = ["alloc"] }
sha2 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
