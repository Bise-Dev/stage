[package]
name = "stage-core"
version = "0.0.0"
edition = "2021"
rust-version = "1.77"

[dependencies]
# `bundled` compiles SQLite from source — no system libsqlite3 dependency, and
# the same build on every dev machine and in CI.
rusqlite = { version = "0.40", features = ["bundled"] }
# Pinned to src-tauri's git2 (0.19) so the workspace links one libgit2-sys.
git2 = { version = "0.19", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `.stage/<branch>/review.toml` + step-file frontmatter are TOML, round-tripped
# through serde. Already resolved in the workspace lock (a Tauri transitive), so
# this adds no new build. Pinned to 0.8 to stay under this crate's MSRV.
toml = "0.8"
# Generates the TypeScript IPC types from these Rust structs (the single source
# of truth for the Tauri boundary). serde-compat (default) honours
# `#[serde(rename_all)]` / `#[serde(flatten)]`; the `#[ts(export)]` files are
# written by `just client::gen-types` (a `cargo test` pass). Pinned to 10.x:
# 12.x raises the MSRV above this crate's `rust-version = "1.77"`.
ts-rs = "10"
thiserror = "2"
tracing = "0.1"
# Resolves the store directory independently of Tauri (see store::default_store_path).
directories = "6"
# Stable hash for the no-remote repo-key fallback. Matches src-tauri's sha2.
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
