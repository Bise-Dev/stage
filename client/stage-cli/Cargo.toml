[package]
name = "stage-cli"
version = "0.0.0"
edition = "2021"
rust-version = "1.77"

# Named `st`, not `stage`: the Tauri app's binary is `Stage`, and macOS
# filesystems are case-insensitive — two bins named `stage`/`Stage` in the
# shared `target/<profile>/` dir are one file, silently clobbering each other.
[[bin]]
name = "st"
path = "src/main.rs"

[dependencies]
stage-core = { path = "../stage-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
