name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
              - 'justfile'
              - '.pre-commit-config.yaml'
            client:
              - 'client/**'
              - '.github/workflows/**'
              - 'justfile'
              - '.pre-commit-config.yaml'

  backend-quality:
    name: backend quality
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Sync Python dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: just lint
      - name: Typecheck (pyrefly)
        run: just typecheck

  client-quality:
    name: client quality
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: client/package.json
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - name: Lint (biome + cargo fmt)
        run: just lint
      - name: Typecheck (tsc + cargo check)
        run: just check
      - name: Clippy
        run: just clippy

  ci-required:
    name: ci required
    needs: [changes, backend-quality, client-quality]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend-quality.result }}
          CLIENT_RESULT: ${{ needs.client-quality.result }}
        run: |
          fail=0
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::detect changes result was '$CHANGES_RESULT'"
            fail=1
          fi
          for r in "$BACKEND_RESULT" "$CLIENT_RESULT"; do
            case "$r" in
              success|skipped|"") ;;
              *) echo "::error::job result was '$r'"; fail=1 ;;
            esac
          done
          exit "$fail"
