<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stage — Local PR Review (print)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="tokens.css">
  <style>
    html, body { margin: 0; padding: 0; background: #f0eee9; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #root { width: 1280px; margin: 0 auto; }

    .page {
      width: 1280px;
      height: 820px;
      background: #fff;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      margin: 24px auto;
      overflow: hidden;
      position: relative;
      break-inside: avoid;
      break-after: page;
      page-break-after: always;
      page-break-inside: avoid;
    }
    .page:last-child { break-after: auto; page-break-after: auto; }

    .section-banner {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 6px 14px;
      background: rgba(0,0,0,0.82);
      color: #fff;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
    }
    .section-banner .right { font-weight: 500; opacity: 0.7; letter-spacing: 0.04em; text-transform: none; }

    @page {
      size: 1280px 820px;
      margin: 0;
    }
    @media print {
      html, body { background: #fff; }
      #root { width: 1280px; margin: 0; }
      .page {
        margin: 0;
        box-shadow: none;
      }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="chrome.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="data-v2.jsx"></script>
  <script type="text/babel" src="direction-a-1.jsx"></script>
  <script type="text/babel" src="direction-a-2.jsx"></script>
  <script type="text/babel" src="screens-v2-workspaces.jsx"></script>
  <script type="text/babel" src="screens-v2-createpr.jsx"></script>
  <script type="text/babel" src="screens-v2-storyline.jsx"></script>
  <script type="text/babel" src="screens-v2-publish.jsx"></script>

  <script type="text/babel">
    function Page({ section, label, children }) {
      return (
        <div className="page">
          <div className="section-banner">
            <span>{section}</span>
            <span className="right">{label}</span>
          </div>
          {children}
        </div>
      );
    }

    function PrintApp() {
      return (
        <>
          <Page section="1 · Workspaces"          label="Authored vs awaiting review"><V2_Workspaces /></Page>
          <Page section="2 · Local review"        label="Diff · summary · transmit"><A_LocalReview /></Page>
          <Page section="3a · Create PR"          label="Order files (drag and drop)"><V2_CreatePR_Order /></Page>
          <Page section="3b · Create PR"          label="Write intros (with preview)"><V2_CreatePR_Intro /></Page>
          <Page section="4 · Storyline review"    label="Walk through author's order"><V2_StorylineReview /></Page>
          <Page section="5 · Publish review"      label="Summary · state · submit"><V2_PublishReview /></Page>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<PrintApp />);

    // Auto-print after fonts + JSX babel + a settle delay
    (async () => {
      try { await document.fonts.ready; } catch {}
      // Wait for the React tree to actually mount
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      // Wait for all babel <script type="text/babel"> blocks to have executed
      const ok = () => document.querySelectorAll('.page').length >= 6;
      for (let i = 0; i < 50 && !ok(); i++) await new Promise(r => setTimeout(r, 100));
      await new Promise(r => setTimeout(r, 500));
      window.print();
    })();
  </script>
</body>
</html>
