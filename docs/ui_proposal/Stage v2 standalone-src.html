<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stage — Local PR Review v2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="tokens.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    #root { height: 100%; }
  </style>

  <template id="__bundler_thumbnail" data-bg-color="#007aff">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <!-- Stage glyph: storyline of numbered review steps connected by a vertical track -->
      <g transform="translate(600 400)">
        <!-- track -->
        <rect x="-6" y="-260" width="12" height="520" rx="6" fill="rgba(255,255,255,0.25)"/>
        <!-- filled portion (completed) -->
        <rect x="-6" y="-260" width="12" height="240" rx="6" fill="#ffffff"/>
        <!-- step 1 (done) -->
        <circle cx="0" cy="-220" r="56" fill="#ffffff"/>
        <path d="M-22 -222 L-6 -206 L24 -240" stroke="#007aff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- step 2 (done) -->
        <circle cx="0" cy="-80" r="56" fill="#ffffff"/>
        <path d="M-22 -82 L-6 -66 L24 -100" stroke="#007aff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- step 3 (current) -->
        <circle cx="0" cy="60" r="64" fill="#ffffff" stroke="#ffffff" stroke-width="10"/>
        <circle cx="0" cy="60" r="64" fill="#ffffff"/>
        <text x="0" y="60" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, system-ui, sans-serif" font-size="64" font-weight="800" fill="#007aff">3</text>
        <!-- step 4 (pending) -->
        <circle cx="0" cy="200" r="48" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="8"/>
      </g>
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="chrome.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="data-v2.jsx"></script>
  <script type="text/babel" src="direction-a-1.jsx"></script>
  <script type="text/babel" src="direction-a-2.jsx"></script>
  <script type="text/babel" src="screens-v2-workspaces.jsx"></script>
  <script type="text/babel" src="screens-v2-createpr.jsx"></script>
  <script type="text/babel" src="screens-v2-storyline.jsx"></script>
  <script type="text/babel" src="screens-v2-publish.jsx"></script>
  <script type="text/babel" src="app-v2.jsx"></script>
</body>
</html>
